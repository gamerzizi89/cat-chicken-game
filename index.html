<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Minecraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #canvas {
            display: block;
            background: #87CEEB;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
        }
        
        #info h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00ff00;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>🎮 3D MINECRAFT</h1>
        <p>WASD - Bewegen</p>
        <p>SPACE - Springen</p>
        <p>Maus - Schauen</p>
        <p>Klick - Blöcke platzieren/entfernen</p>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        // 3D Minecraft-ähnliches Spiel mit Canvas
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Spieler
        const player = {
            x: 50,
            y: 50,
            z: 50,
            yaw: 0,
            pitch: 0,
            vx: 0,
            vy: 0,
            vz: 0,
            onGround: false
        };
        
        // Welt - Blöcke
        let blocks = [];
        
        // Terrain generieren
        function generateTerrain() {
            for (let x = 0; x < 50; x++) {
                for (let z = 0; z < 50; z++) {
                    // Boden
                    blocks.push({
                        x: x * 2,
                        y: 20,
                        z: z * 2,
                        type: 'dirt' // Erde
                    });
                    
                    // Gras auf der Oberseite
                    if (Math.random() > 0.8) {
                        blocks.push({
                            x: x * 2,
                            y: 22,
                            z: z * 2,
                            type: 'grass'
                        });
                    }
                    
                    // Bäume
                    if (Math.random() > 0.95) {
                        // Baumstamm
                        for (let i = 0; i < 4; i++) {
                            blocks.push({
                                x: x * 2,
                                y: 22 + i * 2,
                                z: z * 2,
                                type: 'wood'
                            });
                        }
                        // Baumkrone
                        for (let bx = -2; bx <= 2; bx++) {
                            for (let bz = -2; bz <= 2; bz++) {
                                for (let by = 0; by < 3; by++) {
                                    blocks.push({
                                        x: x * 2 + bx * 2,
                                        y: 26 + by * 2,
                                        z: z * 2 + bz * 2,
                                        type: 'leaves'
                                    });
                                }
                            }
                        }
                    }
                }
            }
        }
        
        // Block zeichnen (isometrische Ansicht)
        function drawBlock(x, y, z, type) {
            // Isometrische Projektion
            const scale = 1;
            const ix = (x - z) * scale;
            const iy = (y - (x + z) * 0.5) * scale;
            
            // Farben für verschiedene Block-Typen
            let color;
            switch(type) {
                case 'dirt':
                    color = '#8B4513'; // Braun
                    break;
                case 'grass':
                    color = '#228B22'; // Grün
                    break;
                case 'wood':
                    color = '#654321'; // Dunkelbraun
                    break;
                case 'leaves':
                    color = '#32CD32'; // Helles Grün
                    break;
                default:
                    color = '#888';
            }
            
            // Projektion auf Canvas
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const screenX = centerX + ix;
            const screenY = centerY + iy;
            
            // Block-Größe
            const blockSize = 10;
            
            // Nur zeichnen, wenn auf dem Screen
            if (screenX > -blockSize * 2 && screenX < canvas.width + blockSize * 2 &&
                screenY > -blockSize * 2 && screenY < canvas.height + blockSize * 2) {
                
                ctx.fillStyle = color;
                ctx.fillRect(screenX - blockSize/2, screenY - blockSize/2, blockSize, blockSize);
                
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.strokeRect(screenX - blockSize/2, screenY - blockSize/2, blockSize, blockSize);
            }
        }
        
        // Tastatur-Input
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });
        
        // Maus-Input
        let mouseDown = false;
        window.addEventListener('mousedown', () => {
            mouseDown = true;
        });
        window.addEventListener('mouseup', () => {
            mouseDown = false;
        });
        window.addEventListener('mousemove', (e) => {
            player.yaw += e.movementX * 0.01;
            player.pitch += e.movementY * 0.01;
        });
        
        // Spieler aktualisieren
        function updatePlayer() {
            // Bewegung
            const speed = 0.5;
            if (keys['w']) {
                player.x += Math.cos(player.yaw) * speed;
                player.z += Math.sin(player.yaw) * speed;
            }
            if (keys['s']) {
                player.x -= Math.cos(player.yaw) * speed;
                player.z -= Math.sin(player.yaw) * speed;
            }
            if (keys['a']) {
                player.x += Math.cos(player.yaw - Math.PI / 2) * speed;
                player.z += Math.sin(player.yaw - Math.PI / 2) * speed;
            }
            if (keys['d']) {
                player.x += Math.cos(player.yaw + Math.PI / 2) * speed;
                player.z += Math.sin(player.yaw + Math.PI / 2) * speed;
            }
            
            // Springen
            if (keys[' '] && player.onGround) {
                player.vy = 1;
                player.onGround = false;
            }
            
            // Gravitation
            player.vy -= 0.05;
            player.y += player.vy;
            
            // Bodenerkennung
            if (player.y <= 22) {
                player.y = 22;
                player.vy = 0;
                player.onGround = true;
            }
        }
        
        // Spiel-Loop
        function gameLoop() {
            // Canvas löschen
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Himmel
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
            
            // Spieler aktualisieren
            updatePlayer();
            
            // Blöcke sortieren (für richtige Zeichnungsreihenfolge)
            blocks.sort((a, b) => {
                const distA = Math.hypot(a.x - player.x, a.z - player.z);
                const distB = Math.hypot(b.x - player.x, b.z - player.z);
                return distB - distA;
            });
            
            // Blöcke zeichnen
            blocks.forEach(block => {
                drawBlock(block.x, block.y, block.z, block.type);
            });
            
            // Spieler-Position zeichnen
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(canvas.width / 2 - 10, canvas.height / 2 - 10, 20, 20);
            
            requestAnimationFrame(gameLoop);
        }
        
        // Initialisierung
        window.addEventListener('load', () => {
            generateTerrain();
            gameLoop();
        });
        
        // Canvas bei Größenänderung anpassen
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
